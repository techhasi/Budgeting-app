name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public by design — safe to bake into the client bundle.
          VITE_GCAL_CLIENT_ID: ${{ vars.GCAL_CLIENT_ID }}
          # Low-value read-only market key; ships in the public bundle. Rotate if abused.
          VITE_MARKET_KEY: ${{ secrets.MARKET_KEY }}
          # NOTE: the backup PAT is intentionally NOT here — it must stay device-only.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
